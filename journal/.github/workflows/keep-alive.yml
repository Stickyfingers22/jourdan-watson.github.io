# Prevents the Supabase Free project from pausing after ~7 days of inactivity.
# Calls a function that returns only the server time; no personal data moves.
#
# Lives here until JOURNAL moves to its own private repository, where this
# folder becomes the repo root's .github/ and GitHub runs it automatically.
# Required repository secrets: SUPABASE_URL, SUPABASE_ANON_KEY.
# Cost: ~1 runner-minute per run (private repos include 2,000 free min/month).
name: supabase-keep-alive

on:
  schedule:
    - cron: "17 14 */3 * *" # every 3 days, 14:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/journal_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat /tmp/out)"
          # A non-2xx fails the run, and GitHub emails you about failed scheduled runs.
          test "$code" -ge 200 && test "$code" -lt 300
